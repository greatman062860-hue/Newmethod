name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix APT sources and update
        run: |
          echo "Removing problematic Google Chrome repository..."
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          
          echo "Cleaning APT cache..."
          sudo apt-get clean
          sudo apt-get autoclean
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "Waiting for apt locks..."
          while sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
            sleep 1
          done
          
          echo "Updating package lists with retry logic..."
          for attempt in {1..3}; do
            echo "Attempt $attempt..."
            if sudo apt-get update -qq; then
              echo "✓ APT update successful"
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Retry attempt $attempt failed, waiting before retry..."
              sleep 5
            else
              echo "✗ All update attempts failed"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          set -e
          echo "Installing essential build tools..."
          
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            git \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libtool \
            m4 \
            autoconf \
            automake \
            pkg-config \
            libltdl-dev \
            libltdl7 \
            cython3 \
            wget \
            curl \
            unzip
          
          echo "✓ Build dependencies installed"

      - name: Verify build tools
        run: |
          echo "=== Verifying installed tools ==="
          libtool --version | head -1
          autoconf --version | head -1
          automake --version | head -1
          
          echo ""
          echo "=== Python and Java versions ==="
          python3 --version
          java -version
          
          echo ""
          echo "✓ All tools verified successfully"

      - name: Install Python packages
        run: |
          echo "Upgrading pip and installing build tools..."
          pip install --upgrade pip setuptools wheel
          
          echo "Installing Buildozer and dependencies..."
          pip install buildozer cython Pillow requests urllib3 kivy
          
          echo "✓ All Python packages installed"

      - name: Verify buildozer
        run: |
          which buildozer
          buildozer --version || echo "Buildozer installed successfully"

      - name: Set up Android SDK
        run: |
          echo "Setting up Android SDK and NDK..."
          mkdir -p $HOME/Android/Sdk
          cd $HOME/Android/Sdk
          
          echo "Downloading Android SDK Command-line Tools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          
          echo "Setting Android environment variables..."
          echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/Android/Sdk/cmdline-tools/latest/bin:$HOME/Android/Sdk/platform-tools:$HOME/Android/Sdk/tools/bin" >> $GITHUB_ENV
          
          echo "Accepting Android SDK licenses..."
          yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          echo "Installing Android SDK packages..."
          $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;25.3.20230213" \
            --channel=0
          
          echo "Verifying Android SDK installation..."
          ls -la $HOME/Android/Sdk/
          
          echo "✓ Android SDK and NDK installed successfully"

      - name: Create buildozer configuration
        run: |
          cat > buildozer.spec << 'BUILDOZER_SPEC'
          [app]
          
          # (str) Title of your application
          title = System Update
          
          # (str) Package name
          package.name = systemupdate
          
          # (str) Package domain (needed for android/ios packaging)
          package.domain = com.android
          
          # (str) Source code where the main.py live
          source.dir = .
          
          # (source.main) Source of the application
          source.main = dropper.py
          
          # (list) Source include patterns (let empty to include all the files)
          source.include_exts = py,png,jpg,kv,atlas
          
          # (list) Source include patterns
          source.include_patterns = assets/*,images/*.png
          
          # (list) Source exclude patterns
          source.exclude_exts = spec
          
          # (list) List of directory to exclude from include on Android
          source.exclude_dirs = tests, bin, .buildozer
          
          # (str) Application versioning (method 1)
          version = 0.1
          
          # (int) Target Android API, should be as high as possible.
          android.api = 33
          
          # (int) Minimum API your APK will support.
          android.minapi = 21
          
          # (str) Android NDK version to use
          android.ndk = 25.3.20230213
          
          # (bool) Use --private data storage (True) or --shared data storage (False)
          android.private_storage = True
          
          # (str) Android app theme, default is ok for Kivy-based app
          android.theme = "@android:style/Theme.NoTitleBar"
          
          # (bool) Copy library instead of making a libpymodules.so
          android.copy_libs = 1
          
          # (str) The Android arch to build for, choices: armeabi-v7a, arm64-v8a, x86, x86_64
          android.archs = arm64-v8a,armeabi-v7a
          
          # (int) overrides automatic versionCode generation
          android.numeric_version = 1
          
          # (list) Pattern to whitelist for the whole project
          android.whitelist = lib-dynload/collections.so
          
          # (str) Android logcat filters to use (default is *)
          android.logcat_filters = *:S python:D
          
          # (bool) Accept SDK license
          android.accept_sdk_license = True
          
          # (list) android.permissions
          android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
          
          # (list) Android features
          android.features = android.hardware.usb.host
          
          [buildozer]
          
          # (int) Log level (0 = error only, 1 = info, 2 = debug (with command output))
          log_level = 2
          
          # (int) Display warning upon buildozer exit (0 = off, 1 = on (default))
          warn_on_root = 1
          
          # (str) Path to build artifact storage, absolute or relative to spec file
          build_dir = .buildozer
          
          # (str) Path to build output (i.e. .apk, .aab, .ipa) storage
          bin_dir = ./bin
          
          BUILDOZER_SPEC
          
          echo "✓ buildozer.spec created"

      - name: Build Android APK (Debug)
        run: |
          echo "Starting APK build process..."
          export ANDROID_SDK_ROOT=$HOME/Android/Sdk
          export ANDROID_HOME=$HOME/Android/Sdk
          export PATH=$PATH:$HOME/Android/Sdk/cmdline-tools/latest/bin:$HOME/Android/Sdk/platform-tools:$HOME/Android/Sdk/tools/bin
          
          echo "Android environment:"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_HOME: $ANDROID_HOME"
          
          buildozer --verbose android debug 2>&1 | tee build_output.log
          
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "Build exit code: $BUILD_EXIT_CODE"
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "⚠️  Build command returned non-zero exit code"
          else
            echo "✓ Build command completed"
          fi

      - name: Check build artifacts & diagnose
        if: always()
        run: |
          echo "========================================"
          echo "BUILD DIAGNOSTICS"
          echo "========================================"
          
          echo ""
          echo "=== Current working directory ==="
          pwd
          
          echo ""
          echo "=== Full directory structure (top level) ==="
          ls -lah
          
          echo ""
          echo "=== Searching for all .apk files recursively ==="
          if find . -name "*.apk" -type f 2>/dev/null; then
            echo "✓ APK found!"
          else
            echo "❌ No APK files found in current search"
          fi
          
          echo ""
          echo "=== Checking bin directory ==="
          if [ -d "bin" ]; then
            echo "bin directory exists:"
            ls -lah bin/
          else
            echo "❌ bin directory not found"
          fi
          
          echo ""
          echo "=== Checking .buildozer directory structure ==="
          if [ -d ".buildozer" ]; then
            echo ".buildozer directory found, searching for APK files:"
            find .buildozer -name "*.apk" -type f 2>/dev/null | head -20
          else
            echo "❌ .buildozer directory not found"
          fi
          
          echo ""
          echo "=== Last 150 lines of build log ==="
          if [ -f build_output.log ]; then
            tail -150 build_output.log
          else
            echo "build_output.log not found"
          fi
          
          echo ""
          echo "=== Checking for build errors in log ==="
          if [ -f build_output.log ]; then
            echo "Errors/Exceptions found:"
            grep -i "error\|exception\|failed" build_output.log | tail -20 || echo "No errors found"
          fi

      - name: Copy APK from .buildozer if needed
        if: always()
        run: |
          echo "Attempting to locate and copy APK from .buildozer..."
          
          # Try to find APK in .buildozer and copy to bin
          if find .buildozer -name "*.apk" -type f 2>/dev/null | head -1 | xargs -I {} cp {} ./bin/ 2>/dev/null; then
            echo "✓ APK copied from .buildozer to bin"
          else
            echo "No APK found in .buildozer to copy"
          fi
          
          # List final contents of bin directory
          echo ""
          echo "=== Final bin directory contents ==="
          if [ -d "bin" ]; then
            ls -lah bin/
          else
            echo "bin directory still not found"
          fi

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemupdate-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_output.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload .buildozer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-diagnostics
          path: .buildozer/
          retention-days: 7
          if-no-files-found: ignore
